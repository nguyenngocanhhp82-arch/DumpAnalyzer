[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dumpanalyzer"
version = "1.2.1"
description = "Công cụ phân tích Dump (BSOD) kết hợp Windows Event Log dành cho kỹ thuật viên IT"

authors = [
    { name = "DumpAnalyzer Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0",
]
report = [
    "jinja2>=3.1.0",
    "openpyxl>=3.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
dumpanalyzer = "dumpanalyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dumpanalyzer = ["storage/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F"]

