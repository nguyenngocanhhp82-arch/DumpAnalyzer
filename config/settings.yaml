# ==============================================================================
# CẤU HÌNH HỆ THỐNG DUMPANALYZER (settings.yaml)
# Nhân viên IT có thể chỉnh sửa các thông số dưới đây theo nhu cầu thực tế.
# ==============================================================================

# 1. Cấu hình cdb.exe (Windows Debugging Tools)
# Nếu để trống (""), chương trình sẽ tự động dò tìm trong các thư mục cài đặt chuẩn.
# Ví dụ: "C:\\Program Files (x86)\\Windows Kits\\10\\Debuggers\\x64\\cdb.exe"
cdb_path: ""

# Đường dẫn máy chủ Symbol của Microsoft và thư mục lưu tạm symbol cục bộ
symbol_path: "srv*C:\\Symbols*https://msdl.microsoft.com/download/symbols"

# Thời gian tối đa cho một tiến trình cdb phân tích một file dump (giây)
cdb_timeout_seconds: 300

# Số tiến trình cdb được phép chạy song song (khuyến nghị 2 - 4)
max_parallel_cdb: 2

# 2. Thư mục làm việc & tìm kiếm dump
# Thư mục tạm để copy dump ra phân tích (tuyệt đối không phân tích trực tiếp trên file gốc)
working_dir: "./workspace"

# Danh sách đường dẫn mặc định để tìm file dump trên máy Windows
dump_search_paths:
  - "C:\\Windows\\Minidump"
  - "C:\\Windows\\MEMORY.DMP"
  - "C:\\Windows\\LiveKernelReports"

# Tự động xoá file dump copy trong thư mục làm việc sau khi phân tích xong (true/false)
auto_cleanup_copied_dumps: false

# Dung lượng tối đa của file dump (GB) được phép copy vào thư mục làm việc (mặc định 8 GB)
# Nếu file lớn hơn hoặc ổ đĩa không đủ dung lượng (cần >= kích thước file x 1.2), sẽ phân tích trực tiếp file gốc
max_copy_gb: 8


# 3. Cấu hình tương quan Event Log
# Khoảng thời gian (phút) trước khi sập để quét các sự kiện nghi ngờ trong Event Log
event_window_minutes: 10

# Thời gian tối đa cho lệnh PowerShell đọc Event Log (giây)
eventlog_timeout_seconds: 120

# Số ngày trước lần sập đầu tiên để kiểm tra các bản cập nhật / phần mềm mới cài đặt
update_history_days: 7

# 4. Ngưỡng chấm điểm & độ tin cậy của Rule Engine
confidence_thresholds:
  high: 70      # Điểm từ 70 trở lên: Độ tin cậy CAO
  medium: 40    # Điểm từ 40 đến 69: Độ tin cậy TRUNG BÌNH
  # Dưới 40: Độ tin cậy THẤP

# Điểm sàn tối thiểu: nếu điểm số cao nhất dưới ngưỡng này -> kết luận "không đủ dữ kiện"
min_verdict_score: 35

# Ngưỡng chênh lệch điểm để phát hiện mâu thuẫn giữa Dump và Event Log (điểm)
# Nếu dump chỉ một hướng, log chỉ hướng khác và điểm chênh lệch < 15 -> gắn cờ "chưa thống nhất"
conflict_threshold: 15

# Thưởng lặp lại: Hệ số nhân tăng điểm khi cùng một giả thuyết lặp lại trên >= 3 lần crash
repeat_multiplier: 1.25

# 5. Ghi log hệ thống
logging:
  level: "INFO"                # DEBUG, INFO, WARNING, ERROR
  log_file: "./logs/dumpanalyzer.log"
  max_bytes: 10485760          # 10 MB mỗi file
  backup_count: 5              # Lưu tối đa 5 file xoay vòng

# ==============================================================================
# CẤU HÌNH BỔ SUNG CHO ĐỢT CẬP NHẬT 03 (v1.1.0)
# ==============================================================================

# Số ngày nhìn lại lịch sử crash của máy (Phần 2.2)
history_lookback_days: 180

# Cấu hình phân tích đội máy (Phần 2.3)
fleet_min_machines: 3          # Tối thiểu N máy gặp cùng bucket/driver
fleet_window_days: 30          # Trong khoảng thời gian D ngày

# Chính sách đánh giá độ tin cậy tách rời khỏi điểm % (Phần 3.2)
confidence_policy:
  high_min_strong_evidence: 2  # Cần >= 2 bằng chứng STRONG từ >= 2 group_id độc lập
  high_max_refute_strong: 0    # Không có bằng chứng phản bác STRONG
  medium_min_strong: 1         # 1 bằng chứng STRONG hoặc >= 2 MEDIUM độc lập
  medium_min_medium_groups: 2

# Ánh xạ tên cột khi nhập danh sách thiết bị từ file CSV AppSheet (Phần 1.4)
asset_csv_mapping:
  hostname: ["tên máy", "device name", "hostname", "computer name", "máy"]
  purchase_date: ["ngày mua", "purchase date", "ngày nhập", "date purchased"]
  warranty_expiry: ["ngày hết hạn bảo hành", "hết bảo hành", "warranty expiry", "warranty end"]
  repair_count: ["số lần sửa", "lần sửa", "repair count", "repairs"]
  ram: ["ram", "bộ nhớ", "dung lượng ram"]
  notes: ["ghi chú", "notes", "lịch sử sửa chữa", "tình trạng"]

# ==============================================================================
# CẤU HÌNH ĐÁNH GIÁ VÀ QUẢN LÝ SẴN SÀNG GHI DUMP (Đợt 04 - v1.2.0)
# ==============================================================================
dump_readiness:
  target_mode: 7
  set_log_event: false
  allow_pagefile_fix: false
  backup_dir: "backup"
  share_dir: ""            # Thư mục chia sẻ chứa báo cáo JSON của đội máy
  stale_days: 14
  volmgr_lookback_days: 180
  dump_gap_days: 90
  dump_gap_match_minutes: 15
  remote_enabled: false
  remote_max_parallel: 5


