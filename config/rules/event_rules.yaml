# ==============================================================================
# QUY TẮC PHÂN TÍCH EVENT LOG (event_rules.yaml)
# Định nghĩa các Event Provider và ID cần giám sát trong cửa sổ trước khi crash.
# Mỗi luật có: adds, cap, strength (strong/medium/weak), polarity (support/refute), group_id.
# ==============================================================================

events:
  - source: "Microsoft-Windows-WHEA-Logger"
    ids: [1, 17, 18, 19, 20, 47]
    description: "Cảnh báo lỗi phần cứng CPU / Bus PCIe / Bộ nhớ từ Windows Hardware Error Architecture"
    adds:
      cpu: 25
      ram: 15
      psu: 10
    cap: 40
    strength: "strong"
    polarity: "support"
    group_id: "eventlog_whea"

  - source: "Disk"
    ids: [7, 11, 51, 153]
    description: "Lỗi đọc/ghi bad block ổ cứng hoặc timeout I/O"
    adds:
      storage: 25
    cap: 40
    strength: "strong"
    polarity: "support"
    group_id: "eventlog_disk"

  - source: "stornvme"
    ids: [129]
    description: "Lệnh reset thiết bị điều khiển NVMe"
    adds:
      storage: 25
    cap: 35
    strength: "strong"
    polarity: "support"
    group_id: "eventlog_nvme"

  - source: "storahci"
    ids: [129]
    description: "Lệnh reset cổng SATA AHCI"
    adds:
      storage: 20
    cap: 30
    strength: "strong"
    polarity: "support"
    group_id: "eventlog_ahci"

  - source: "Display"
    ids: [4101]
    description: "Driver card đồ hoạ bị treo và đã tự phục hồi (TDR)"
    adds:
      gpu: 30
    cap: 40
    strength: "medium"
    polarity: "support"
    group_id: "eventlog_display_tdr"

  - source: "nvlddmkm"
    ids: [13, 14]
    description: "Lỗi crash hoặc timeout nội bộ từ driver đồ họa NVIDIA"
    adds:
      gpu: 35
    cap: 45
    strength: "strong"
    polarity: "support"
    group_id: "eventlog_nvidia"

  - source: "Ntfs"
    ids: [55]
    description: "Hệ thống tệp NTFS bị hỏng cấu trúc (file system corruption)"
    adds:
      storage: 20
    cap: 30
    strength: "medium"
    polarity: "support"
    group_id: "eventlog_ntfs"

  - source: "Microsoft-Windows-Kernel-Power"
    ids: [41]
    description: "Hệ thống bị tắt hoặc khởi động lại không sạch (mất điện, treo cứng hoặc BSOD)"
    adds:
      psu: 15
      thermal: 10
    cap: 25
    strength: "weak"
    polarity: "support"
    group_id: "eventlog_kp41"

  - source: "EventLog"
    ids: [6008]
    description: "Lần tắt máy trước đó xảy ra đột ngột / bất thường"
    adds:
      psu: 10
      thermal: 10
    cap: 20
    strength: "weak"
    polarity: "support"
    group_id: "eventlog_6008"

  - source: "volmgr"
    ids: [161]
    description: "Ghi file dump thất bại do lỗi thiết bị lưu trữ hoặc thiếu dung lượng"
    adds:
      storage: 20
    cap: 25
    strength: "medium"
    polarity: "support"
    group_id: "eventlog_volmgr"

  - source: "Microsoft-Windows-Kernel-PnP"
    ids: [219]
    description: "Driver thiết bị không nạp được thành công (Kernel-PnP ID 219)"
    adds:
      driver: 25
    cap: 35
    strength: "medium"
    polarity: "support"
    group_id: "eventlog_kernel_pnp"

  - source: "Microsoft-Windows-CodeIntegrity"
    ids: [3033, 3063]
    description: "Driver bị chặn do không đạt kiểm tra chữ ký số hoặc tính toàn vẹn mã (Code Integrity)"
    adds:
      driver: 30
    cap: 40
    strength: "strong"
    polarity: "support"
    group_id: "eventlog_code_integrity"

  - source: "Application Error"
    ids: [1000]
    description: "Nhiều ứng dụng khác nhau bị sập ngẫu nhiên (Application Error ID 1000) gợi ý bất ổn định RAM/bộ nhớ"
    adds:
      ram: 25
    cap: 35
    strength: "medium"
    polarity: "support"
    group_id: "eventlog_app_crash"

  - source: "Microsoft-Windows-Kernel-Processor-Power"
    ids: [37]
    description: "Xung nhịp CPU bị firmware giới hạn do nhiệt độ hoặc năng lượng (Event 37)"
    adds:
      thermal: 25
      cpu: 15
    cap: 35
    strength: "medium"
    polarity: "support"
    group_id: "eventlog_processor_power"

  - source: "WindowsUpdateClient"
    ids: [19, 20]
    description: "Bản cập nhật Windows vừa cài đặt thành công hoặc thất bại"
    adds:
      update: 20
    cap: 30
    strength: "medium"
    polarity: "support"
    group_id: "eventlog_update"

  - source: "MsiInstaller"
    ids: [11707, 1033]
    description: "Phần mềm mới vừa được cài đặt hoặc gỡ bỏ qua Windows Installer"
    adds:
      driver: 10
      update: 15
    cap: 20
    strength: "weak"
    polarity: "support"
    group_id: "eventlog_installer"
